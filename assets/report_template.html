<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Code Review Report</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; }
        h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }
        .summary { background: #f4f4f4; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .issue { border: 1px solid #ddd; border-radius: 5px; margin-bottom: 15px; overflow: hidden; }
        .issue-header { padding: 10px; color: white; font-weight: bold; display: flex; justify-content: space-between; }
        .p0 { background-color: #d73a49; }
        .p1 { background-color: #f66a0a; }
        .p2 { background-color: #005cc5; }
        .p3 { background-color: #6a737d; }
        .issue-body { padding: 15px; }
        .label { font-weight: bold; color: #555; }
        pre { background: #f8f8f8; padding: 10px; border-radius: 3px; overflow-x: auto; border: 1px solid #eee; }
        code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    </style>
</head>
<body>
    <h1>Code Review 審核報告</h1>
    
    <div class="summary">
        <h2>整體總結</h2>
        <p>{{OVERALL_SUMMARY}}</p>
    </div>

    <h2>發現的問題</h2>
    <!-- ISSUE_START -->
    <div class="issue">
        <div class="issue-header {{SEVERITY_CLASS}}">
            <span>[{{SEVERITY}}] {{TITLE}}</span>
            <span>位置：{{LOCATION}}</span>
        </div>
        <div class="issue-body">
            <p><span class="label">問題主因：</span><br>{{REASON}}</p>
            <p><span class="label">解決方式：</span></p>
            <pre><code>{{SOLUTION}}</code></pre>
        </div>
    </div>
    <!-- ISSUE_END -->

    <p style="text-align: center; color: #888; font-size: 0.8em; margin-top: 50px;">
        Generated by Gemini CLI Code Review Expert
    </p>
</body>
</html>
